name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,browser]"
      - run: pip install -e sdk/python
      - run: python scripts/setup_browsers.py --with-deps
      - run: ruff check .
      - run: pytest -rs
        env:
          SENTINELX_CI: "1"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - run: npm test --workspace sdk/typescript
