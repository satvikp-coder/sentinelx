# SentinelX Agent Guard policy
# Generated by `sentinelx init`. Safe defaults: monitor mode, empty allowlists.
version: "1.0"

# monitor: record what would happen; enforce: block for real
mode: "monitor"

# Hosts the agent may contact. Empty by default: nothing is pre-allowed.
# Add exact hosts (no wildcards), e.g. "orders.lab.test".
allowed_hosts: []

# Tools the agent may call. Empty by default: every tool is unknown/blocked
# until declared here.
allowed_tools: []

# Tools that require human confirmation (CONFIRM) in enforce mode.
high_impact_actions: []

# Regex patterns scrubbed from prompts and stored evidence.
secret_patterns:
  - "sk-[A-Za-z0-9_-]{16,}"
  - "gh[pousr]_[A-Za-z0-9]{20,}"
  - "synth_tok_[0-9a-f]{8,}"
