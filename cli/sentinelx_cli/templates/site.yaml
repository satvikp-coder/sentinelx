# SentinelX Site Guard configuration
# Generated by `sentinelx init`. Safe defaults: monitor-only, no auto-apply, lab targets only.
version: "1.0"

# Targets this installation may scan. This version supports lab targets only
# (localhost, 127.0.0.1, ::1 and *.lab.test). Non-lab scanning is DISABLED.
targets:
  - id: "vibe_notes_node"
    name: "Vibe Notes Node Lab"
    base_url: "http://127.0.0.1:18081"
    lab: true

# Scan behavior (non-destructive by default)
scan:
  profile: "default"
  requests_per_second: 10
  burst: 10
  max_depth: 3
  max_pages: 100

# Fix engine: never auto-apply; a human approves every change
fix:
  auto_apply: false
  require_approval: true
  max_fixes_per_run: 5

# Shield (reverse proxy) defaults: monitor mode, fail open
shield:
  mode: monitor          # monitor | recommend | enforce
  auto_shield: false
  fail_open: true
  listen:
    host: "127.0.0.1"
    port: 18090
  upstream: "http://127.0.0.1:18081"
  lab_mode: false
  kill_switch_file: null
