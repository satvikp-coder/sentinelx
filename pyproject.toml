[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelx"
version = "0.0.0"
description = "Sentinel X - Agent Security Digital Twin (hackathon prototype; scaffold only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6",
]
browser = ["playwright>=1.48,<2"]

[tool.setuptools]
package-dir = {"sentinelx" = "packages"}
packages = ["sentinelx", "sentinelx.common_schemas", "sentinelx.agent_runtime", "sentinelx.model_clients", "sentinelx.adversarial", "sentinelx.policy", "sentinelx.evidence", "sentinelx.investigator", "sentinelx.containment", "sentinelx.verifier", "sentinelx.scanner", "sentinelx.fixer", "sentinelx.shield"]

[tool.setuptools.package-data]
"sentinelx.common_schemas" = ["schemas/*.json"]
"sentinelx.evidence" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", ".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sentinelx"]
