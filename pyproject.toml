[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelx"
version = "0.0.0"
description = "Sentinel X - Agent Guard and Site Guard local security prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "uvicorn>=0.30,<1",
  "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6",
  "hypothesis==6.170.12",
]
browser = ["playwright>=1.48,<2"]

[tool.setuptools]
package-dir = {"sentinelx" = "packages", "sentinelx_cli" = "cli/sentinelx_cli"}
packages = ["sentinelx", "sentinelx.common_schemas", "sentinelx.agent_runtime", "sentinelx.model_clients", "sentinelx.adversarial", "sentinelx.policy", "sentinelx.evidence", "sentinelx.investigator", "sentinelx.containment", "sentinelx.verifier", "sentinelx.scanner", "sentinelx.scanner.checks", "sentinelx.agent_test", "sentinelx.external_scanner", "sentinelx.fixer", "sentinelx.shield", "sentinelx.evaluation", "sentinelx.report", "sentinelx_cli"]

[project.scripts]
sentinelx = "sentinelx_cli.main:main"

[tool.setuptools.package-data]
"sentinelx.common_schemas" = ["schemas/*.json"]
"sentinelx.evidence" = ["migrations/*.sql"]
"sentinelx_cli" = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with:Warning"]
markers = [
  "browser: needs Playwright Chromium (fails loudly when SENTINELX_CI=1 and missing)",
  "docker: needs a running Docker daemon (fails loudly when SENTINELX_CI=1 and it is down)",
  "live: makes ONE tiny real model call; skipped (loudly) when no MODEL_API_KEY is configured",
  "slow: automatically applied to every browser/docker/live test (see conftest.py); fast dev loop: pytest -m \"not slow\" - CI still runs everything, unmarked",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", ".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sentinelx"]
