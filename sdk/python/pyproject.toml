[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelx-agent-guard"
version = "0.0.0"
description = "Agent Guard SDK: policy-enforced tool calls backed by the Sentinel X gateway"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "sentinelx",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
]

[tool.setuptools]
packages = ["sentinelx_agent_guard"]
