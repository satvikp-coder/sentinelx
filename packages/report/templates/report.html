<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'none'; connect-src 'none'; font-src 'none'">
<title>$title</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; padding: 1.2rem; background: #0b0e14; color: #e6e6e6;
       font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
main { max-width: 70rem; margin: 0 auto; }
h1 { font-size: 1.5rem; color: #ffffff; }
h2 { font-size: 1.2rem; color: #ffd166; border-bottom: 1px solid #2a3140; padding-bottom: .3rem; margin-top: 2rem; }
h3 { font-size: 1rem; color: #9ad1ff; margin: 1rem 0 .4rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: .8rem; }
.card { background: #121722; border: 1px solid #2a3140; border-radius: 8px; padding: .8rem 1rem; }
.card .metric { font-size: 1.15rem; color: #ffffff; font-weight: 600; }
.card .name { color: #9ad1ff; font-size: .85rem; word-break: break-word; }
.label { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em;
         padding: .1rem .45rem; border-radius: 4px; margin: .15rem .2rem .15rem 0; }
.lbl-OBSERVED { background: #1d3a2a; color: #7ee2a8; }
.lbl-INFERRED { background: #3a2f14; color: #ffd166; }
.lbl-SIMULATED { background: #14243a; color: #9ad1ff; }
.lbl-VERIFIED { background: #23143a; color: #c9a2ff; }
.lbl-NOTAVAILABLE { background: #3a1414; color: #ff9d9d; }
table { border-collapse: collapse; width: 100%; margin: .5rem 0; font-size: .9rem; }
th, td { border: 1px solid #2a3140; padding: .35rem .55rem; text-align: left; vertical-align: top; }
th { background: #161d2b; color: #9ad1ff; }
tr:nth-child(even) td { background: #10151f; }
.bar { background: #1d2635; border-radius: 4px; height: .9rem; position: relative; overflow: hidden; }
.bar > span { position: absolute; inset: 0 auto 0 0; background: #4c9aff; }
.na { color: #ff9d9d; font-weight: 600; }
.box { background: #121722; border: 1px solid #2a3140; border-left: 4px solid #ffd166;
       border-radius: 8px; padding: .8rem 1rem; margin: 1rem 0; }
.box.warn { border-left-color: #ff9d9d; }
.muted { color: #8b93a3; font-size: .85rem; }
pre { white-space: pre-wrap; word-break: break-word; background: #10151f;
      border: 1px solid #2a3140; border-radius: 6px; padding: .6rem; font-size: .8rem; }
footer { margin-top: 2rem; color: #8b93a3; font-size: .8rem; }
@media (max-width: 40rem) { body { padding: .6rem; } }
</style>
</head>
<body>
<main>
$body
<footer>$footer</footer>
</main>
</body>
</html>
